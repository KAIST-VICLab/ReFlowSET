# ReFlowSET — SAR2Opt arm.
#
# Same provenance rules as `configs/qxs_saropt.yaml`: every value is the value
# the released `sar2opt` checkpoint was trained with, cross-checked against the
# training command line, the config embedded in the checkpoint, and the log.
#
# This arm differs from QXS-SAROPT in exactly three places — resolution 512,
# global batch 32, and 20,000 steps. Everything else is identical.
#
# The 20,000 steps are a deliberate per-arm budget, not a truncated 40,000-step
# run: the cosine schedule's total was 20,000, so the learning rate annealed to
# `min_lr` exactly at the end. Both arms are half of C-DiffSET's sample budget
# on the same dataset (512 px: 80,000 x 16 = 1,280,000 versus ours
# 20,000 x 32 = 640,000).
#
# ---------------------------------------------------------------------------
# Data are NOT redistributed. Set `data.root` to your own copy of SAR2Opt
# (https://github.com/MarsZhaoYT/SAR2Opt-Heterogeneous-Dataset). The split
# lists in `splits/` are frozen and must be used verbatim.

name: sar2opt

data:
  # Directory containing `trainA/`, `trainB/`, `testA/`, `testB/`.
  root: /path/to/sar2opt
  # EO paths, relative to `root`. The SAR path is derived by replacing the last
  # character of the leading directory (`trainB` -> `trainA`, `testB` ->
  # `testA`). 1,450 train / 627 test.
  train_list: splits/sar2opt/train_eo_list.txt
  path_rule: sar2opt
  # SAR2Opt tiles are 600x600. 512 is a CROP, never a resize: a random 512
  # window at training, and the exact centre window at offset (600-512)//2 = 44
  # at test time.
  resolution: 512
  num_workers: 8
  pin_memory: true

model:
  in_channels: 128
  out_channels: 128
  hidden_size: 1024
  depth: 24            # 8 double-stream + 16 single-stream
  num_heads: 16        # head dim 64
  mlp_ratio: 4.0       # SwiGLU
  axes_dim: [32, 32]   # 2-D RoPE over (y, x); must sum to the head dim
  theta: 10000
  double_blocks: 8
  double_merge: token
  sample_size: 512     # provenance only; the forward pass derives every shape
  # The frozen FLUX.2 autoencoder. Build it with
  # `scripts/convert_flux2_ae.py`, or point this at the `vae/` subfolder of a
  # released ReFlowSET checkpoint.
  ae: weights/ae.safetensors

bridge:
  # Design B: z_t = (1 - t) * eps + t * z_e, conditioned on the SAR latent,
  # target u* = z_e - eps. t = 0 is noise and t = 1 is data.
  source: noise
  sigma_b: 0.0         # deterministic bridge; no stochastic term ever runs
  t_end: 1.0
  time_scheme: uniform # t ~ U(0, 1), clamped to [0, 1 - 1e-3]
  # Per-row Bernoulli zeroing of the SAR latent — the same all-zero null the
  # classifier-free-guidance branch uses at sampling time.
  cond_drop_p: 0.1

loss:
  flow: mse            # plain velocity MSE; the beta-NLL head never ran
  lambda_repa: 0.5
  repa_gate: linear    # w(t) = t, applied per sample
  repa_block: 8        # 1-based tap; == double_blocks, so the tap is the EO
                       # stream leaving the last double-stream block
  repa_dim: 1024       # DINOv3 ViT-L/16 embedding width

# Representation alignment teacher. NOT redistributed: download DINOv3 from
# https://github.com/facebookresearch/dinov3 and accept its licence. Set both
# fields, or set `loss.lambda_repa: 0.0` to train without the REPA term (which
# is an ablation, not the released recipe).
repa_teacher:
  variant: lvd         # LVD-1689M ViT-L/16 — the checkpoint that actually ran
  repo: null           # path to a clone of facebookresearch/dinov3
  weights: null        # .../dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth

aug:
  # One identical element of the 8-element dihedral group is drawn per sample
  # and applied to SAR and EO together.
  hflip: true
  vflip: true
  rot90: true
  # No speckle augmentation and no speckle-consistency loss were used. The
  # knobs for them are deliberately absent from this config rather than
  # present and set to zero.

train:
  steps: 20000
  global_batch_size: 32
  # As run: micro-batch 32, gradient accumulation 1, on one B200 (peak 101.57
  # GiB allocated, ~6 h, 30.7 samples/s). Lower this — it must divide
  # `global_batch_size` — to fit a smaller card; the effective batch, and
  # therefore the recipe, is unchanged.
  micro_batch_size: 32
  lr: 5.0e-4
  lr_schedule: cosine
  min_lr: 1.0e-6
  warmup_steps: 1000
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  max_grad_norm: 1.0
  ema_decay: 0.9999
  mixed_precision: bf16
  seed: 2024
  log_every: 50
  ckpt_every: 5000
  output_dir: runs/sar2opt
