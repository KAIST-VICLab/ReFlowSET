# Conditional BBDM - QXS SAR->EO (256, vq-f4)
# Derived from Template-ConditionalSARtoOptical.yaml, adapted to 256px QXS and the shared
# ${DATA_ROOT}/qxs_bbdm tree (custom_aligned: A=SAR cond, B=EO target).
# Differences vs the plain BBDM QXS config: UNet in_channels 6 + condition_key SpatialRescaler
# (cond image spatially rescaled and concatenated in latent space).
runner: "BBDMRunner"
training:
  n_epochs: 100
  n_steps: 50000
  save_interval: 10
  sample_interval: 10
  validation_interval: 10
  accumulate_grad_batches: 1

testing:
  clip_denoised: False
  sample_num: 1

data:
  dataset_name: 'QXS'
  dataset_type: 'custom_aligned'
  dataset_config:
    dataset_path: '${DATA_ROOT}/qxs_bbdm'
    image_size: 256
    channels: 3
    to_normal: True
    flip: False
  train:
    batch_size: 32
    shuffle: True
  val:
    batch_size: 32
    shuffle: True
  test:
    batch_size: 31  # 3999 = 129*31; loaders use drop_last=True, so 31 covers the full test set
    # shuffle: False

model:
  model_name: "cBBDM-f4" # part of result path
  model_type: "LBBDM" # specify a module
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False
  # model_load_path:  # model checkpoint path
  # optim_sche_load_path:  # optimizer scheduler checkpoint path

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8 # step
    start_ema_step: 30000

  CondStageParams:
    n_stages: 2
    in_channels: 3
    out_channels: 3

  VQGAN:
    params:
      ckpt_path: '${CKPT_ROOT}/vqgan/vq-f4/model.ckpt'
      embed_dim: 3
      n_embed: 8192
      ddconfig:
        double_z: false
        z_channels: 3
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: !!python/tuple
          - 1
          - 2
          - 4
        num_res_blocks: 2
        attn_resolutions: [ ]
        dropout: 0.0

      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear' # options {'linear', 'sin'}
      objective: 'grad' # options {'grad', 'noise', 'ysubx'}
      loss_type: 'l1' # options {'l1', 'l2'}

      skip_sample: True
      sample_type: 'linear' # options {"linear", "sin"}
      sample_step: 200

      num_timesteps: 1000 # timesteps
      eta: 1.0 # DDIM reverse process eta
      max_var: 1.0 # maximum variance

      UNetParams:
        image_size: 64
        in_channels: 6
        model_channels: 128
        out_channels: 3
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 32
          - 16
          - 8
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "SpatialRescaler" # options {"SpatialRescaler", "first_stage", "nocond"}
