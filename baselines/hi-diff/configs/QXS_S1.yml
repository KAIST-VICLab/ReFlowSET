# HI-Diff Stage-1 on QXS SAR->EO (LQ = SAR (grayscale, auto-replicated to 3ch by cv2 IMREAD_COLOR), GT = EO RGB).
# Budget note: official recipe is S1 300k + S2 300k iters with a progressive
# patch/batch schedule (16@128 -> 2@384, 20k each then 200k @384).
# QXS images are fixed 256x256, so progressive training is disabled
# (single group: batch 8 @ 256; official uses batch 4 at 256px, batch 16 only at
# 128px -- batch 16 @ 256 OOMs even on 180GB). Matched budget: S1 25k + S2 25k = 50k total.
name: train_HI_Diff_QXS_S1
model_type: HI_Diff_S1
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: PairedImageIRDataset
    dataroot_gt: ${DATA_ROOT}/QXS_AB/trainB
    dataroot_lq: ${DATA_ROOT}/QXS_AB/trainA
    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

    ### progressive training disabled: single fixed group (QXS is 256px)
    mini_batch_sizes: [8]
    iters: [25000]
    gt_size: 256
    gt_sizes: [256]

  val:
    name: ValSet
    type: PairedImageIRDataset
    dataroot_gt: ${DATA_ROOT}/qxs_hidiff/valB
    dataroot_lq: ${DATA_ROOT}/qxs_hidiff/valA
    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures
network_g:
  type: Transformer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3,5,6,6]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  embed_dim: 64
  group: 4 # N=4*4

network_le:
  type: latent_encoder_gelu
  in_chans: 6
  embed_dim: 64 # same as above
  block_num: 6
  group: 4 # same as above
  stage: 1
  patch_expansion: 0.5
  channel_expansion: 4

# path
path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true

  pretrain_network_le: ~
  param_key_g: params
  strict_load_le: true

  resume_state: ~

# training settings
train:
  total_iter: 25000
  warmup_iter: -1 # no warm up
  use_grad_clip: True

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [8000, 17000]
    restart_weights: [1,1]
    eta_mins: [0.0002,0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_total:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
