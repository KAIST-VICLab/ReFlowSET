# Stage 2: official C-DiffSET (eps + confidence) on QXS-SAROPT, frozen official
# split. Copy of configs/qxs_eps_conf.yaml with the paths of this kit,
# gpu index, explicit fp32, and accelerator_path -> stage-1 output.
seed: 2024
num_worker: 4
work_dir: ${WORK_DIR}/qxs_cdiffset/

phase: train

# feeder
feeder: feeders.feeder.QXSFeeder
train_feeder_args:
  dataroot: ${DATA_ROOT}/QXSLAB_SAROPT/
  listroot: ${SPLITS_ROOT}/qxs-saropt/train_eo_list.txt
  load_size: 256
  crop_size: 256
  hflip: True
  vflip: True
  rot: True

test_feeder_args:
  dataroot: ${DATA_ROOT}/QXSLAB_SAROPT/
  listroot: ${SPLITS_ROOT}/qxs-saropt/test_eo_list.txt
  load_size: 256
  crop_size: 256

# optim
optimizer: AdamW
learning_rate: 3e-5
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
prediction_type: epsilon

# logging
log_iter: 100
save_iter: 2000
save_epoch: 50
eval_epoch: 10

# training
gpu: 0
batch_size: 64
test_batch_size: 1
mixed_precision: "no"
pretrained_model_name_or_path: Manojb/stable-diffusion-2-1-base
accelerator_path: ${WORK_DIR}/qxs_sd21ft/lastest/model.safetensors

# test
num_inference_steps: 50
val_len: 100
